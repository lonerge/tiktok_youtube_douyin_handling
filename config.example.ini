[Crawlers]
# Comma-separated search keywords
Keywords_english = new,girls
Keywords_chinese = 热梗,热点
Tiktok_crawler = True
Youtube_crawler = True
Douyin_crawler = True
Max_thread = 1
Max_page = 3

# HTTP connection/read timeout in seconds
Request_connect_timeout = 5
Request_read_timeout = 20

# Local credential files. These are ignored by Git. Environment variables
# TIKTOK_COOKIES_FILE and DOUYIN_COOKIES_FILE override these paths.
Tiktok_cookies_file = tiktok_cookies.json
Douyin_cookies_file = douyin_cookies.txt

Proxy_switch = False
Use_simple_proxy = False
Simple_proxy = 127.0.0.1:9494
Use_socks5_proxy = False
Socks5_proxy = socks5://127.0.0.1:9494

[Login]
Proxy_switch = False
Use_simple_proxy = False
Simple_proxy = http://127.0.0.1:9494
Use_socks5_proxy = False
Socks5_proxy = socks5://127.0.0.1:9494
Max_upload_time = 180

[Web_API]
Host = 0.0.0.0
Port = 5050

[Path]
Mongo_host_local = 127.0.0.1
Mongo_host_server = 127.0.0.1
Mongo_port = 27017
# Mongo_username = admin
# Mongo_password = password
Chrome_log = chrome_logs/
Video_path = static/videos/
Error_path = static/errors/
chrome_version = 86
